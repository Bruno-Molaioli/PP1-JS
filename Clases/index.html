<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Vault</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-900 min-h-screen text-white">

    <!-- NAVBAR -->
    <nav class="border-b border-slate-800 bg-slate-900/40 backdrop-blur-md py-4">

        <div class="container mx-auto px-6 flex justify-between items-center">

            <h2 class="text-xl font-bold text-cyan-400 tracking-wider">
                VINYL VAULT
            </h2>

            <div class="flex gap-10 items-center">

                <!-- EXPLORAR -->
                <button
                    onclick="mostrarExplorar()"
                    id="explorar-btn"
                    class="text-2xl font-semibold tracking-wide text-cyan-400 hover:text-cyan-300 transition-all duration-300 underline underline-offset-8 decoration-2"
                >
                    Explorar
                </button>

                <!-- PERFIL -->
                <button
                    onclick="mostrarPerfil()"
                    id="perfil-btn"
                    class="text-2xl font-semibold tracking-wide text-slate-300 hover:text-white transition-all duration-300"
                >
                    Perfil
                </button>

            </div>

        </div>

    </nav>

    <!-- CONTENIDO -->
<div class="container mx-auto px-6 py-12">

    <!-- ========================= -->
    <!-- EXPLORAR -->
    <!-- ========================= -->

    <div id="search-section" class="block">

        <!-- TITULO -->
        <header class="text-center mb-16">

            <h1
                class="text-6xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 via-teal-200 to-cyan-500 bg-clip-text text-transparent">

                Vinyl Vault

            </h1>

        </header>

        <!-- BUSCADOR -->
        <div class="max-w-2xl mx-auto">

            <div
                class="flex items-center bg-slate-900/60 border border-slate-700 rounded-2xl overflow-hidden shadow-lg shadow-cyan-500/10">

                <!-- INPUT -->
                <input
                    id="search-input"
                    type="text"
                    placeholder="Buscar discos..."
                    class="w-full bg-transparent px-5 py-4 outline-none text-white placeholder:text-slate-500"
                >

                <!-- BOTON -->
                <button
                    id="search-btn"
                    class="bg-gradient-to-r from-cyan-500 to-teal-500 px-8 py-4 hover:from-cyan-400 hover:to-teal-400 transition-all duration-300 active:scale-95">

                    Buscar

                </button>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- PERFIL -->
    <!-- ========================= -->

    <div id="profile-section" class="hidden text-center">

        <h2 class="text-5xl font-bold text-cyan-400">
            perfil de @bruno
        </h2>

    </div>

</div>

   <script>

    function mostrarPerfil() {

        document
            .getElementById("search-section")
            .classList.add("hidden")

        document
            .getElementById("profile-section")
            .classList.remove("hidden")

    }

    function mostrarExplorar() {

        document
            .getElementById("profile-section")
            .classList.add("hidden")

        document
            .getElementById("search-section")
            .classList.remove("hidden")

    }

    </script>

</body>

</html>
